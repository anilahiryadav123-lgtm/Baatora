name: Build Baatora APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project zip kholna
        run: |
          if [ -f Baatora-Android-Project.zip ]; then unzip -o -q Baatora-Android-Project.zip; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK banana
        run: |
          cd Baatora
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Baatora-Browser-APK
          path: Baatora/app/build/outputs/apk/debug/app-debug.apk
